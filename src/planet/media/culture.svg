<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img"><title>兩位孩子以揮手打招呼，對話鼓勵詢問對方，不將動作與國籍固定配對</title><rect width="800" height="520" fill="#dfdadc"/><g font-family="Arial,Microsoft JhengHei,sans-serif"><rect x="24" y="30" width="752" height="420" rx="14" fill="#fff7e4"/><g transform="translate(180 230) scale(1.05)"><path d="M-18 85l-8 60M18 85l10 60" fill="none" stroke="#324959" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M-32 34Q0 7 32 34L40 92H-40Z" fill="#497c8d"/><circle cx="0" cy="0" r="26" fill="#c99273"/><path d="M-25 0Q-33-41 9-32L29-9 4-18Z" fill="#303e48"/><path d="M-7 7h13" fill="none" stroke="#644936" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(620 230) scale(1.05)"><path d="M-18 85l-8 60M18 85l10 60" fill="none" stroke="#324959" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M-32 34Q0 7 32 34L40 92H-40Z" fill="#b36d54"/><circle cx="0" cy="0" r="26" fill="#c99273"/><path d="M-25 0Q-33-41 9-32L29-9 4-18Z" fill="#303e48"/><path d="M-7 7h13" fill="none" stroke="#644936" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="260" y="60" width="286" height="110" rx="18" fill="#ecd17f"/><text x="288" y="109" font-size="29" fill="#233b4c">揮手也可以。</text><text x="288" y="146" font-size="25" fill="#233b4c">先問問對方吧！</text><path d="M208 277l65-72M590 277l-60-66" fill="none" stroke="#c99273" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="495" font-size="22" fill="#233b4c">虛構交流活動｜一個人的動作，不代表整個文化。</text></g></svg>