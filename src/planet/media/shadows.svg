<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img"><title>相同高度的物體，低角度光源投下長影，高角度光源投下較短影</title><rect width="800" height="520" fill="#f7e1a2"/><g font-family="Arial,Microsoft JhengHei,sans-serif"><rect x="0" y="347" width="800" height="173" rx="0" fill="#b5cda8"/><circle cx="80" cy="160" r="42" fill="#f2ab3c"/><circle cx="470" cy="70" r="42" fill="#f2ab3c"/><rect x="220" y="233" width="17" height="114" rx="0" fill="#456676"/><rect x="580" y="233" width="17" height="114" rx="0" fill="#456676"/><path d="M230 353h150" fill="none" stroke="#56605a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M590 353h 50" fill="none" stroke="#56605a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 179L230 235 380 347" fill="none" stroke="#d89431" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M485 111L588 235 640 347" fill="none" stroke="#d89431" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="50" font-size="28" fill="#233b4c">太陽位置低，影子長</text><text x="433" y="40" font-size="28" fill="#233b4c">位置高，影子較短</text><path d="M400 80v320" fill="none" stroke="#fff7df" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="25" y="452" font-size="26" fill="#233b4c">同高物體・同一平地｜光線方向比較</text><text x="26" y="493" font-size="20" fill="#233b4c">概念圖：不按天體距離與比例繪製。不要直視太陽。</text></g></svg>