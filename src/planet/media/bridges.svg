<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img"><title>兩端相同支撐距離的紙橋比較，上方折線紙與下方彎曲平紙；非承重數據圖</title><rect width="800" height="520" fill="#d8e6ea"/><g font-family="Arial,Microsoft JhengHei,sans-serif"><text x="30" y="40" font-size="34" fill="#233b4c">材料一樣，結構不同</text><rect x="45" y="210" width="130" height="230" rx="0" fill="#ad7852"/><rect x="625" y="210" width="130" height="230" rx="0" fill="#ad7852"/><path d="M83 225Q400 400 720 225" fill="none" stroke="#e4b69c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M83 200L140 130H750L693 200Z" fill="#fff7da" stroke="#bd9b52" stroke-width="3"/><g stroke="#bc9d61" stroke-width="4"><path d="M94 187H704M106 173H716M118 159H728M129 145H739"/></g><path d="M400  80v40m-10-13 10 13 10-13" fill="none" stroke="#bd543f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="437" y="104" font-size="22" fill="#233b4c">重量</text><text x="254" y="410" font-size="27" fill="#233b4c">摺線沿跨越方向</text><text x="175" y="492" font-size="23" fill="#233b4c">平紙容易彎｜摺紙改變抵抗彎曲的能力</text><path d="M55 245h110M635 245h110" fill="none" stroke="#805333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 287h110M635 287h110" fill="none" stroke="#805333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 329h110M635 329h110" fill="none" stroke="#805333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 371h110M635 371h110" fill="none" stroke="#805333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 413h110M635 413h110" fill="none" stroke="#805333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></svg>