<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img"><title>滿月、半月、細彎與暗面外觀的概念比較，不是依時間排序的月相表</title><rect width="800" height="520" fill="#18354f"/><g font-family="Arial,Microsoft JhengHei,sans-serif"><text x="30" y="50" font-size="31" fill="#fff5cf">同一顆球，看到不同亮面</text><circle cx="110" cy="247" r="72" fill="#31465d"/><circle cx="110" cy="247" r="72" fill="#f3e7b6"/><circle cx="302" cy="247" r="72" fill="#31465d"/><path d="M302 175a72 72 0 0 1 0 144Z" fill="#f3e7b6"/><circle cx="494" cy="247" r="72" fill="#31465d"/><path d="M529 184a72 72 0 0 1 0 126q72-63 0-126" fill="#f3e7b6"/><circle cx="686" cy="247" r="72" fill="#31465d"/><text x="35" y="410" font-size="25" fill="#f5e8c5">亮面外觀示意，不代表月球變成不同形狀。</text><text x="35" y="480" font-size="22" fill="#cfdfed">非軌道位置圖；未按比例繪製。</text></g></svg>